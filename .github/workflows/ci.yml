name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, typecheck, unit + integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PWA icons
        run: npm run icons

      - name: Lint
        run: npm run lint

      - name: Typecheck (client)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck (worker)
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Unit + component tests
        run: npm test

      - name: Worker integration tests (workerd + D1)
        run: npm run test:workers

      - name: Build (client + worker bundle)
        run: npm run build

      - name: Validate Cloudflare deploy configuration
        run: npx wrangler deploy --dry-run
